<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Waste Sorting AI</h1>
            <p>Upload an image to classify the material.</p>
        </header>

        <main>
            <div class="upload-area" id="upload-area">
                <input type="file" id="image-input" accept="image/*" hidden>
                <div class="upload-placeholder" id="upload-placeholder">
                    <span>Click or Drag & Drop an image here</span>
                </div>
                <img id="image-preview" alt="Preview" hidden />
            </div>

            <button id="predict-btn" disabled>Predict Class</button>

            <div class="result-card" id="result-card" hidden>
                <div class="result-item">
                    <span class="label">Prediction</span>
                    <span class="value" id="pred-class">-</span>
                </div>
                <div class="result-item">
                    <span class="label">Confidence</span>
                    <span class="value" id="pred-conf">-</span>
                </div>
            </div>
            
            <div id="loading-spinner" class="spinner" hidden></div>
            <div id="error-message" class="error-msg" hidden></div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
