name: Build and Push Docker Image

# This workflow runs automatically whenever we push code to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  docker:
    # A fresh Ubuntu environment to build our image
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the latest code from our repository
      - name: Check out the repo
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub
      # Requires you to set DOCKER_USERNAME and DOCKER_PASSWORD in your Repo Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Set up Buildx (great for modern, multi-platform Docker builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build the image and push it to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Context tells Docker to build from our current root folder
          context: .
          # Push strictly if the build works
          push: true
          # We tag the image. The 'latest' tag makes it easy to pull
          # It assumes your repo name in Docker Hub will be 'waste-sorting-api'
          tags: ${{ secrets.DOCKER_USERNAME }}/waste-sorting-api:latest
